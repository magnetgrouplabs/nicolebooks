name: Release

# Tag-driven release. Pushing a tag like v0.2.0 builds a Windows NSIS installer and macOS
# dmg + zip artifacts and uploads them, plus the latest.yml / latest-mac.yml feeds that
# electron-updater reads, to a GitHub Release on this repository.
#
# The release is left as a DRAFT (publish.releaseType in electron-builder.yml). Publishing it is a
# deliberate human step, because publishing is what makes the feed visible to every installed copy
# of the app.
#
# The repository is public, so the shipped app checks for updates anonymously and no token
# is embedded in the binary. The only credential used here is the automatic GITHUB_TOKEN,
# which never leaves the runner.
#
# Artifacts are UNSIGNED for now. CSC_IDENTITY_AUTO_DISCOVERY is pinned to false on macOS so
# electron-builder does not pick up a stray keychain identity and produce a half signed
# bundle. Notarization is intentionally absent. When certificates are procured, the signing
# secrets get added here and the README install notes get shortened.

on:
  push:
    tags:
      - 'v*'

# electron-builder --publish always needs write access to create the release and upload to it.
permissions:
  contents: write

jobs:
  # The draft release has to exist BEFORE the matrix starts.
  #
  # electron-builder's GitHub publisher looks for a release matching the tag and creates one if it
  # does not find it. Two matrix jobs starting together both look, both find nothing, and both
  # create one, and GitHub allows that because a draft release does not own its tag yet. The result
  # is two releases for one tag with the artifacts split across them, which is exactly what v26.7.1
  # produced on its first successful build: latest.yml on one and latest-mac.yml on the other, and
  # a zip on one with its blockmap on the other.
  #
  # Creating the draft here, in a single job the matrix depends on, closes the window: by the time
  # either builder looks, the release is already there and both attach to it.
  draft:
    name: create the draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
          else
            gh release create "$TAG" \
              --draft \
              --title "${TAG#v}" \
              --notes "Installers for ${TAG#v}. Windows: NicoleBooks-Setup-${TAG#v}.exe. Mac: the arm64 dmg for Apple Silicon, the plain dmg for Intel."
          fi

  release:
    name: build and publish (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: a partial release is easier to
      # complete than one that never started.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # electron-vite 5 requires Node 20.19+ or 22.12+.
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the macOS Intel sharp binary
        if: runner.os == 'macOS'
        # npm installs only the sharp binary matching the host, and the runner is arm64, so the
        # x64 dmg and zip would otherwise ship without one and sharp would fail to load on an
        # Intel Mac.
        #
        # sharp's documented --cpu/--os flags only filter which OPTIONAL dependencies a normal
        # `npm install sharp` resolves. Naming a platform package directly still trips npm's
        # EBADPLATFORM check, and running it as `npm install --cpu=x64 --os=darwin sharp` instead
        # would re-resolve the whole tree under an x64 filter and prune the arm64 binaries that
        # the other half of this build needs. --force is the one flag that waives the platform
        # check, and because it is scoped to these two exact packages nothing already on disk is
        # touched and no other platform's variants are pulled in.
        #
        # Versions are read out of sharp's own optionalDependencies so they cannot drift when
        # sharp is upgraded. Both packages are pure binary drops with no install scripts, so
        # --ignore-scripts costs nothing and skips a redundant second electron-rebuild that the
        # root postinstall would otherwise trigger; the explicit rebuild step runs next anyway.
        run: |
          sharp_x64=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          libvips_x64=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          echo "sharp-darwin-x64@${sharp_x64}, sharp-libvips-darwin-x64@${libvips_x64}"
          npm install --no-save --force --ignore-scripts \
            "@img/sharp-darwin-x64@${sharp_x64}" \
            "@img/sharp-libvips-darwin-x64@${libvips_x64}"
          node -e "
            const fs = require('fs')
            for (const p of ['node_modules/@img/sharp-darwin-x64/lib', 'node_modules/@img/sharp-libvips-darwin-x64/lib']) {
              if (!fs.existsSync(p)) throw new Error('missing ' + p)
            }
            console.log('darwin x64 sharp binaries present')
          "

      - name: Rebuild native module against the Electron ABI
        # Surfaces an ABI or toolchain failure as its own step rather than inside packaging.
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build (main, preload, renderer)
        run: npm run build

      - name: Unit tests (Vitest)
        # Last gate before artifacts go to a public release page.
        run: npx vitest run

      - name: Package and publish
        # No platform flag: electron-builder targets the host platform, which is exactly the
        # matrix split. install-app-deps runs first and rebuilds native deps per target arch.
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS only, ignored elsewhere. Keeps the build unsigned and deterministic.
          CSC_IDENTITY_AUTO_DISCOVERY: false
